apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}:{{ required "set --set image.tag=<commit sha>" .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Migrations run once in the migrate Job, not in every replica.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend   # nginx.conf in the frontend image proxies to this name
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - port: 8000
