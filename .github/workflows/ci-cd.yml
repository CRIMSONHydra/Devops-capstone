name: ci-cd

on:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run pytest (a failure stops the pipeline)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker:
    needs: [backend-tests, frontend-build]   # only runs if both passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR names must be lowercase
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build backend image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE }}/backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build frontend image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ env.IMAGE }}/frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Trivy: fail the pipeline on HIGH/CRITICAL CVEs. Runs before anything is pushed.
      - name: Trivy scan backend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            "$IMAGE/backend:${{ github.sha }}"

      - name: Trivy scan frontend
        if: success() || failure()   # still scan the frontend if the backend scan failed
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            "$IMAGE/frontend:${{ github.sha }}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          docker push "$IMAGE/backend:${{ github.sha }}"
          docker push "$IMAGE/frontend:${{ github.sha }}"
