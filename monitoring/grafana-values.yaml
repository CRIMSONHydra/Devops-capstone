# Grafana part of kube-prometheus-stack. The chart already provisions Prometheus as the
# default datasource (http://kube-prometheus-stack-prometheus.monitoring:9090).
# Do not put the admin password here; set it with --set grafana.adminPassword=...
grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard      # any ConfigMap with this label becomes a dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
