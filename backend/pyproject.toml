[project]
name = "ecommerce-admin-backend"
version = "1.0.0"
description = "FastAPI backend for the ecommerce admin console"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "prometheus-fastapi-instrumentator==7.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.uv]
package = false  # an application, not an installable library

[tool.pytest.ini_options]
testpaths = ["tests"]
